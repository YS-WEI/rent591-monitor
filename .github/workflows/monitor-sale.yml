name: 591 買屋監控排程

on:
  # 排程由外部 Google Apps Script（triggerSale，每 6 小時）呼叫 workflow_dispatch 觸發。
  # 不用 GitHub schedule（best-effort，常被丟；原理同 monitor.yml）。
  workflow_dispatch: {}

permissions:
  contents: write

# 與租屋共用同一 group → 不會同時跑
concurrency:
  group: rent591-data
  cancel-in-progress: false

jobs:
  monitor-sale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取分支開跑當下的最新版（concurrency 排隊後才拿得到前一輪剛 push 的快照）
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行買屋監控
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SALE_TELEGRAM_CHAT_ID: ${{ secrets.SALE_TELEGRAM_CHAT_ID }}
          SALE_DISCORD_WEBHOOK_URL: ${{ secrets.SALE_DISCORD_WEBHOOK_URL }}
          SALE_NOTIFY_ROUTES: ${{ secrets.SALE_NOTIFY_ROUTES }}
        run: python main.py --type sale

      - name: Commit 快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "本輪無資料變動，略過 commit。"
          else
            git commit -m "chore: 更新買屋快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git push && break || { echo "push 撞版，rebase 重試 $i"; git pull --rebase --autostash; }
            done
          fi
