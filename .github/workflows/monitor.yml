name: 591 監控排程

on:
  schedule:
    # 每小時一輪（cron 為 UTC）。用第 17 分而非整點，避開整點排程尖峰
    # （減少 GitHub 排程延遲與 591 對機房 IP 的偶發封鎖）。
    # 註：GitHub 排程是 best-effort，實測 */2 時約 3/4 的排程被丟（一天只跑 ~3 次），
    # 改每小時是用排程次數換實際執行次數；仍不穩定的話改用外部觸發 workflow_dispatch。
    - cron: "17 * * * *"
  workflow_dispatch: {}  # 允許在 Actions 頁面手動觸發（改完訂閱想立即跑）

# 讓 job 能把快照 commit 回 repo
permissions:
  contents: write

# 與買屋 workflow 共用同一 group → 兩者不會同時跑（避免同時 push 撞版）
concurrency:
  group: rent591-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行監控
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ROUTES: ${{ secrets.NOTIFY_ROUTES }}
        run: python main.py

      - name: Commit 快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "本輪無資料變動，略過 commit。"
          else
            git commit -m "chore: 更新租屋快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # push 前先 rebase（與買屋 workflow 寫不同檔，衝突可自動併），重試幾次
            for i in 1 2 3; do
              git push && break || { echo "push 撞版，rebase 重試 $i"; git pull --rebase --autostash; }
            done
          fi
