name: 591 監控排程

on:
  # 排程由外部 Google Apps Script（triggerRent，每小時）呼叫 workflow_dispatch 觸發。
  # 不用 GitHub schedule：它是 best-effort，實測 */2、每小時都常被丟（一天只跑 ~3 次），
  # 且與外部觸發撞期時會造成多餘的排隊執行。網頁「立即更新」也走 workflow_dispatch。
  workflow_dispatch: {}

# 讓 job 能把快照 commit 回 repo
permissions:
  contents: write

# 與買屋 workflow 共用同一 group → 兩者不會同時跑（避免同時 push 撞版）
concurrency:
  group: rent591-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 取分支「開跑當下」的最新版，而非觸發當下的 SHA：
          # concurrency 排隊等前一輪跑完時，才能拿到前一輪剛 push 的快照（否則用舊快照比對、push 衝突失敗）
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝相依套件
        run: pip install -r requirements.txt

      - name: 執行監控
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ROUTES: ${{ secrets.NOTIFY_ROUTES }}
        run: python main.py

      - name: Commit 快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "本輪無資料變動，略過 commit。"
          else
            git commit -m "chore: 更新租屋快照 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # push 前先 rebase（與買屋 workflow 寫不同檔，衝突可自動併），重試幾次
            for i in 1 2 3; do
              git push && break || { echo "push 撞版，rebase 重試 $i"; git pull --rebase --autostash; }
            done
          fi
